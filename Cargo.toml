[package]
name = "shotty"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Turn the output of any command into a PNG or JPG image"
license = "MIT"
repository = "https://github.com/phranck/shotty"
readme = "README.md"
keywords = ["terminal", "screenshot", "ansi", "image", "cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "assets/**/*", "LICENSE", "README.md"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
jiff = "1.0.1"
plist = "1.10.4"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
toml = "1.2.1"
unicode-width = "0.2.3"
vte = "0.15.0"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
